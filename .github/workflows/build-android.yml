name: 自动打包安卓APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装Node环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 编译前端网页
        run: |
          npm install
          npm run build

      - name: 安装打包工具
        run: npm install -g cordova

      - name: 创建安卓壳项目
        run: |
          cordova create app com.sesame.ag SesameAG
          cd app
          cordova platform add android

      - name: 把编译好的网页移入APP
        run: |
          rm -rf app/www/*
          cp -r dist/* app/www/

      - name: 编译安卓调试APK
        run: |
          cd app
          cordova build android

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: SesameAG安卓安装包
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
